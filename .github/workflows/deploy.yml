name: Deploy backend to VPS

# Deploys the backend to the production VPS on every push to main
# (i.e. every merged PR), and can also be run manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run at once.
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.VPS_PROJECT_DIR || '/srv/store/store-inventory-backend' }}"
            PROJECT_DIR="$(pwd)"

            echo "==> Fetching latest main"
            git fetch --prune origin
            git reset --hard origin/main

            echo "==> Activating virtualenv"
            if [ -d .venv ]; then . .venv/bin/activate; \
            elif [ -d venv ]; then . venv/bin/activate; \
            else echo "No .venv or venv found in $PROJECT_DIR"; exit 1; fi

            echo "==> Installing dependencies"
            pip install -r requirements.txt

            echo "==> Running migrations"
            python manage.py migrate --noinput

            echo "==> Collecting static files"
            python manage.py collectstatic --noinput || true

            echo "==> Restarting app"
            if [ -n "${{ secrets.VPS_SERVICE }}" ]; then
              sudo systemctl restart "${{ secrets.VPS_SERVICE }}"
            else
              # Auto-detect the systemd unit whose definition references this project dir.
              UNIT="$(grep -rl "$PROJECT_DIR" /etc/systemd/system/*.service 2>/dev/null | head -1 | xargs -r basename)"
              if [ -n "$UNIT" ]; then
                echo "Auto-detected systemd unit: $UNIT"
                sudo systemctl restart "$UNIT"
              elif command -v supervisorctl >/dev/null 2>&1; then
                echo "Restarting supervisor programs"
                sudo supervisorctl restart all
              else
                echo "ERROR: could not determine how to restart the app."
                echo "Set the VPS_SERVICE secret to your service name."
                exit 1
              fi
            fi

            echo "==> Deploy complete"
